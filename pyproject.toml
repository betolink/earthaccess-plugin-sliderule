[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "earthaccess-sliderule"
version = "0.1.0"
description = "On-demand ICESat-2 and GEDI processing with SlideRule from earthaccess."
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "earthaccess contributors" }]
dependencies = [
  "earthaccess-plugin-spec >=0.1.0",
  "sliderule",  # VERIFY: run() signature and init() keywords
]

[project.entry-points."earthaccess.plugins"]
sliderule = "earthaccess_sliderule:SlideRulePlugin"

[project.optional-dependencies]
test = ["pytest >=8.0"]

[project.urls]
Repository = "https://github.com/betolink/earthaccess-plugin-sliderule"

# The contract lives on GitHub until it is published to PyPI.
[tool.uv.sources]
earthaccess-plugin-spec = { git = "https://github.com/betolink/earthaccess-plugin-spec.git", branch = "main" }

[tool.hatch.build.targets.wheel]
packages = ["src/earthaccess_sliderule"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-ra"

[tool.ruff]
line-length = 88
src = ["src", "tests"]

[tool.ruff.lint]
extend-select = ["I", "UP", "B"]

[tool.mypy]
python_version = "3.10"
files = ["src", "tests"]
disallow_untyped_defs = true
pretty = true

[[tool.mypy.overrides]]
module = ["sliderule", "sliderule.*", "pytest", "pytest.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
module = ["tests.*"]
disallow_untyped_defs = false
